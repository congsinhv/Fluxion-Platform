<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Strict CSP defends localStorage-stored JWT against stored-XSS payloads
      (the XSS trade-off accepted in Validation Session 1). Notes:
      - script-src has NO 'unsafe-inline' / 'unsafe-eval' — the actual XSS vector.
      - style-src has NO 'unsafe-inline' — Vite production bundles all CSS to
        an external sheet and we never use React `style={{…}}` props.
        (If a third-party React component ever needs inline style, switch to
        nonce-based CSP rather than re-adding 'unsafe-inline'.)
      - connect-src covers AppSync + Cognito IDP origins.
    -->
    <!-- connect-src is rewritten at build/serve time from VITE_APPSYNC_URL
         (see vite.config.ts injectCsp); the value below is a safe default. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://*.appsync-api.ap-southeast-1.amazonaws.com wss://*.appsync-realtime-api.ap-southeast-1.amazonaws.com https://cognito-idp.ap-southeast-1.amazonaws.com; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#8A5A12" />
    <meta property="og:title" content="Fluxion MDM Console" />
    <meta property="og:description" content="AWS-native MDM platform for Android DPC devices." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Fluxion MDM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
